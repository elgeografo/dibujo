
name: Build & Publish Quarto (Pages via Actions)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2

      # R solo si lo usas
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("knitr","rmarkdown","ggplot2","dplyr","readr"))'

      # Render (para libros Quarto el output es _book; para websites es _site)
      - name: Render
        run: quarto render .

      # Sube el sitio generado como artifact para Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book   # usa _site si tu proyecto es website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

